<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <meta name="description" content="Ways to connect with the Graham-Browns">
  <title>Graham-Brown's on the internet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <main id="home">
      <div class="content">
        <section aria-labelledby="intro-title">
          <h1 id="intro-title">Laura GB <span>Making data<br>work for people.</span></h1>
        </section>

        <nav class="destinations" aria-label="Explore my work">
          <a class="destination" href="https://hatfullofdata.blog/" target="_blank" rel="noopener noreferrer">
            <img class="destination-icon" src="logo.png" alt="Hat Full of Data logo" width="60" height="60" decoding="async">
            <span class="destination-copy">
              <span class="destination-label">Hat Full of Data blog</span>
              <span class="destination-description">Practical ideas on Microsoft Fabric, Power BI and the Power Platform.</span>
            </span>
          </a>
          <a class="destination" href="https://www.linkedin.com/in/lauragb/" target="_blank" rel="noopener noreferrer">
            <img class="destination-icon" src="LinkedIn.png" alt="LinkedIn logo" width="60" height="60" decoding="async">
            <span class="destination-copy">
              <span class="destination-label">Find me on LinkedIn</span>
              <span class="destination-description">Connect and follow along with what I’m working on.</span>
            </span>
          </a>
        </nav>
      </div>
    </main>

    <footer class="site-footer">
      <p>© <span id="year">2026</span> Graham-Brown Family</p>
      <p class="footer-note">More useful things, in time.</p>
    </footer>
  </div>
</body>
</html>
